<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- Primary meta tags -->
  <meta name="description" content="Shop professional-grade power tools, hand tools, and hardware at ToolsHub. Top brands, pro-grade gear, fast delivery, and unbeatable deals.">
  <meta name="keywords" content="tools, power tools, hand tools, hardware, drills, saws, workshop, ToolsHub, tools online, professional tools">
  <meta name="author" content="ToolsHub">
  <meta name="theme-color" content="#1A1A1A">
  <link rel="canonical" href="https://toolshub.app/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ToolsHub">
  <meta property="og:title" content="ToolsHub — Professional Tools & Hardware Store">
  <meta property="og:description" content="Shop professional-grade power tools, hand tools, and hardware. Top brands, pro-grade gear, fast delivery, and unbeatable deals.">
  <meta property="og:url" content="https://toolshub.app/">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="ToolsHub — Professional Tools & Hardware">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ToolsHub — Professional Tools & Hardware Store">
  <meta name="twitter:description" content="Shop professional-grade power tools, hand tools, and hardware. Top brands, pro-grade gear, fast delivery, and unbeatable deals.">
  <meta name="twitter:image" content="icons/Icon-512.png">
  <meta name="twitter:image:alt" content="ToolsHub — Professional Tools & Hardware">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ToolsHub">
  <meta name="application-name" content="ToolsHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ToolsHub — Professional Tools & Hardware</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #th-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1A1A1A 0%, #333333 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .45s ease;
    }
    #th-splash .logo {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .4);
      animation: th-pop .6s cubic-bezier(.2,.8,.2,1);
    }
    #th-splash .logo svg { width: 48px; height: 48px; fill: #1A1A1A; }
    #th-splash .brand {
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-top: 24px;
    }
    #th-splash .tag {
      color: rgba(255, 255, 255, .68);
      font-size: 13px;
      letter-spacing: 1.5px;
      margin-top: 8px;
    }
    #th-splash .ring {
      margin-top: 40px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, .18);
      border-top-color: #fff;
      border-radius: 50%;
      animation: th-spin .8s linear infinite;
    }
    @keyframes th-spin { to { transform: rotate(360deg); } }
    @keyframes th-pop {
      0%   { transform: scale(.6); opacity: 0; }
      100% { transform: scale(1);  opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="th-splash">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
      </svg>
    </div>
    <div class="brand">TOOLSHUB</div>
    <div class="tag">Professional Tools &amp; Hardware</div>
    <div class="ring"></div>
  </div>

  <script>
    // Fade the branded loader out once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('th-splash');
      if (s) {
        s.style.opacity = '0';
        setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
