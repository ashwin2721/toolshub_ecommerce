<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- Primary meta tags -->
  <meta name="description" content="{{BRAND_DESC}}">
  <meta name="keywords" content="{{BRAND_KEYWORDS}}">
  <meta name="author" content="{{BRAND_NAME}}">
  <meta name="theme-color" content="{{BRAND_THEME}}">
  <link rel="canonical" href="{{BRAND_URL}}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND_NAME}}">
  <meta property="og:title" content="{{BRAND_TITLE}}">
  <meta property="og:description" content="{{BRAND_DESC}}">
  <meta property="og:url" content="{{BRAND_URL}}">
  <meta property="og:image" content="brand/{{BRAND_ID}}/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="{{BRAND_NAME}} — {{BRAND_TAGLINE}}">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{BRAND_TITLE}}">
  <meta name="twitter:description" content="{{BRAND_DESC}}">
  <meta name="twitter:image" content="brand/{{BRAND_ID}}/icons/Icon-512.png">
  <meta name="twitter:image:alt" content="{{BRAND_NAME}} — {{BRAND_TAGLINE}}">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{BRAND_NAME}}">
  <meta name="application-name" content="{{BRAND_NAME}}">
  <link rel="apple-touch-icon" href="brand/{{BRAND_ID}}/icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="brand/{{BRAND_ID}}/favicon.png"/>

  <title>{{BRAND_TITLE}}</title>
  <link rel="manifest" href="brand/{{BRAND_ID}}/manifest.json">

  <style>
    #th-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, {{BRAND_THEME}} 0%, {{BRAND_SPLASH_TO}} 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .45s ease;
    }
    #th-splash .logo {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .4);
      animation: th-pop .6s cubic-bezier(.2,.8,.2,1);
    }
    #th-splash .logo img { width: 48px; height: 48px; }
    #th-splash .brand {
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-top: 24px;
    }
    #th-splash .tag {
      color: rgba(255, 255, 255, .68);
      font-size: 13px;
      letter-spacing: 1.5px;
      margin-top: 8px;
    }
    #th-splash .ring {
      margin-top: 40px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, .18);
      border-top-color: #fff;
      border-radius: 50%;
      animation: th-spin .8s linear infinite;
    }
    @keyframes th-spin { to { transform: rotate(360deg); } }
    @keyframes th-pop {
      0%   { transform: scale(.6); opacity: 0; }
      100% { transform: scale(1);  opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="th-splash">
    <div class="logo">
      <img src="brand/{{BRAND_ID}}/logo.svg" alt="" width="48" height="48">
    </div>
    <div class="brand">{{BRAND_WORDMARK}}</div>
    <div class="tag">{{BRAND_TAGLINE}}</div>
    <div class="ring"></div>
  </div>

  <script>
    // Fade the branded loader out once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('th-splash');
      if (s) {
        s.style.opacity = '0';
        setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
