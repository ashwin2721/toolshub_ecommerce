name: toolshub
description: "TOOLSHUB – Professional Tools & Hardware Store. Enterprise e-commerce platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.2.0

  # Auth Providers
  google_sign_in: ^6.2.1

  # UI Components
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  animate_do: ^3.3.4
  lottie: ^3.1.2
  timeline_tile: ^2.0.0

  # Payments
  razorpay_flutter: ^1.3.6

  # Networking & Storage
  dio: ^5.5.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Utilities
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  intl: ^0.20.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  equatable: ^2.0.5
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  pinput: ^3.0.1
  qr_flutter: ^4.1.0
  geolocator: ^12.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
